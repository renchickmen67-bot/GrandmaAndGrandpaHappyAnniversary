<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Годовщина: Бабушка и Дедушка</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="overlay-text fade-in">
    <h1>С годовщиной,<br>любимые бабушка и дедушка! ❤️</h1>
    <p>Ваша любовь — самый тёплый свет в нашей жизни.</p>
  </div>

  <!-- Кнопки сразу под текстом -->
  <div class="controls-container under-text">
    <button class="btn-add-hearts" onclick="addExtraHearts()">✨ Добавить сердечек</button>
    <button class="btn-menu" onclick="toggleMenu()">📦 Меню подарков</button>
  </div>

  <div id="menu-layer">
    <div class="menu-header">
      <h2>Выбери подарок</h2>
      <p style="color: #7a5b5b; margin-top: 5px;">Нажми на карточку, чтобы открыть пожелание</p>
    </div>
    <div class="gift-grid" id="gifts-container"></div>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
